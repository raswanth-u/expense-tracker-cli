# =============================================================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# =============================================================================
# 
# This config connects to the PRODUCTION environment:
#   - Runs on standard port 443 (HTTPS)
#   - Uses main database (port 5432)
#   - Contains real/live data
#
# Usage:
#   expense --env prod user list
#   expense -e prod expense add --amount 50 --category Food --user-id 1
#   expense --env prod --interactive
# =============================================================================

[api]
# Production API URL (uses standard HTTPS port 443)
base_url = "https://localhost/api"

# Skip SSL verification (set to false if using valid certs, true for self-signed)
skip_ssl_verify = true

[display]
# Python interpreter path (leave empty to use system default)
python_path = ""

# Python display module path
display_module = "./python_display/display.py"

[defaults]
# Default user ID for operations
default_user_id = 1

# Default date format
date_format = "%Y-%m-%d"
