[package]
name = "expense-cli"
version = "1.0.0"
edition = "2021"

[dependencies]
# HTTP client
reqwest = { version = "0.11", features = ["json", "blocking"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI framework
clap = { version = "4.5", features = ["derive"] }

# Interactive prompts
dialoguer = "0.11"

# Config management
toml = "0.8"

# Error handling
anyhow = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Table display
# tabled = "0.15"

# Python integration
pyo3 = { version = "0.20", features = ["auto-initialize"] }